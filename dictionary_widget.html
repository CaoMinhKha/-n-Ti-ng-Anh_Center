<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dictionary Quick Widget</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .widget { max-width: 600px; border: 1px solid #ddd; border-radius: 8px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .widget h1 { margin-top: 0; font-size: 24px; }
        .field { margin-bottom: 12px; }
        .field label { display: block; margin-bottom: 4px; font-weight: bold; }
        .field input, .field select, .field button { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        .result { margin-top: 18px; padding: 14px; background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; }
        .result h2 { margin: 0 0 10px; font-size: 20px; }
        .result p { margin: 8px 0; }
        .links a { color: #1565c0; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="widget">
    <h1>Dictionary Quick Widget</h1>
    <div class="field">
        <label for="word">Từ cần tra</label>
        <input id="word" type="text" placeholder="ví dụ: example hoặc chào" />
    </div>
    <div class="field">
        <label for="lang">Ngôn ngữ</label>
        <select id="lang">
            <option value="en">Tiếng Anh</option>
            <option value="vi">Tiếng Việt</option>
        </select>
    </div>
    <div class="field">
        <button id="searchBtn">Tra nhanh</button>
    </div>
    <div id="output" class="result" style="display:none;"></div>
</div>
<script>
    const searchBtn = document.getElementById('searchBtn');
    const output = document.getElementById('output');

    searchBtn.addEventListener('click', async () => {
        const word = document.getElementById('word').value.trim();
        const lang = document.getElementById('lang').value;
        if (!word) {
            output.style.display = 'block';
            output.innerHTML = '<p>Vui lòng nhập một từ để tra.</p>';
            return;
        }

        output.style.display = 'block';
        output.innerHTML = '<p>Đang tải...</p>';

        try {
            const response = await fetch(`index.php?request=dictionary/quick&word=${encodeURIComponent(word)}&lang=${lang}`);
            const data = await response.json();

            if (!data.status) {
                output.innerHTML = `<p style="color:red;">${data.message || 'Lỗi khi lấy dữ liệu'}</p>`;
                return;
            }

            const refs = data.references || {};
            const urls = data.search_urls || {};
            let html = `<h2>Kết quả tra: ${data.word}</h2>`;
            if (data.short_definition) {
                html += `<p><strong>Định nghĩa ngắn:</strong> ${data.short_definition}</p>`;
            }
            if (data.part_of_speech) {
                html += `<p><strong>Loại từ:</strong> ${data.part_of_speech}</p>`;
            }
            html += '<div class="links"><strong>Link tham khảo:</strong><ul>';
            if (urls.cambridge) html += `<li><a href="${urls.cambridge}" target="_blank">Cambridge</a></li>`;
            if (urls.deepl_en_vi) html += `<li><a href="${urls.deepl_en_vi}" target="_blank">DeepL</a></li>`;
            if (urls.deepl_vi_en) html += `<li><a href="${urls.deepl_vi_en}" target="_blank">DeepL (dịch)</a></li>`;
            if (urls.google_translate_vi_en) html += `<li><a href="${urls.google_translate_vi_en}" target="_blank">Google Translate</a></li>`;
            if (urls.tophonetics) html += `<li><a href="${urls.tophonetics}" target="_blank">Toph Phonetics</a></li>`;
            if (refs.cambridge && !urls.cambridge) html += `<li><a href="${refs.cambridge}" target="_blank">Cambridge</a></li>`;
            if (refs.deepl && !urls.deepl_en_vi && !urls.deepl_vi_en) html += `<li><a href="${refs.deepl}" target="_blank">DeepL</a></li>`;
            if (refs.tophonetics && !urls.tophonetics) html += `<li><a href="${refs.tophonetics}" target="_blank">Toph Phonetics</a></li>`;
            html += '</ul></div>';

            output.innerHTML = html;
        } catch (err) {
            output.innerHTML = `<p style="color:red;">Lỗi: ${err.message}</p>`;
        }
    });
</script>
</body>
</html>
